repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        # numpy/pandas/omegaconf ship inline types (py.typed) that mypy needs installed to
        # resolve annotations like numpy.typing.NDArray - without these the hook's isolated
        # env can't see them and every such annotation fails as "not valid as a type", even
        # though `mypy src` passes cleanly against the project's real .venv (CLAUDE.md §6).
        additional_dependencies:
          ["numpy==2.2.6", "pandas==2.3.3", "omegaconf==2.3.1", "nibabel==5.4.2"]
        files: ^src/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
